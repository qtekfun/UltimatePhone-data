# SPDX-License-Identifier: GPL-3.0-or-later

name: Build spam packs and rules (daily)

# Rebuilds the spam packs (only sources whose policy is `package`) and the prefix rules, then publishes a COMPLETE
# signed release: the business packs are carried over from the latest release. With no packageable source the
# build succeeds and publishes the rules alone. If nothing changed since the latest release, nothing is published.
on:
  schedule:
    - cron: "17 3 * * *" # every day, 03:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, sign and verify but do not publish a release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# Shared with build-businesses.yml: both publish a full manifest, so they must never run at the same time.
concurrency:
  group: data-release
  cancel-in-progress: false

env:
  KEEP_RELEASES: "2"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r pipeline/requirements.txt

      - name: Licence audit
        run: python -m pipeline audit

      # Spam packs are rebuilt, so they are not fetched; rules are fetched only to detect "unchanged".
      - name: Fetch the latest release (signature verified) to carry over the business packs
        run: python -m pipeline fetch-previous --skip-type spam

      - name: Build spam packs and rules
        run: |
          set -euo pipefail
          python -m pipeline spam
          python -m pipeline rules

      - name: Choose the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/next-tag.sh

      - name: Assemble, sign and write SHA256SUMS
        id: assemble
        env:
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
        run: |
          python -m pipeline assemble --tag "${{ steps.tag.outputs.tag }}" \
            --replace-type spam --replace-type rules --skip-if-rules-unchanged
          ls -l dist/release 2>/dev/null || true

      - name: Verify the release (signature, checksums, every pack opens and answers a query)
        if: steps.assemble.outputs.changed == 'true'
        run: python -m pipeline verify

      - name: Publish release and prune old ones
        if: ${{ steps.assemble.outputs.changed == 'true' && github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: scripts/publish.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "### Spam and rules build"
            echo "Result: ${{ job.status }}; changed: ${{ steps.assemble.outputs.changed }}"
            [ -f dist/release/manifest.json ] && { echo '```'; cat dist/release/manifest.json; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"
