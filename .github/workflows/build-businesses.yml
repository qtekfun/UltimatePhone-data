name: Build businesses (monthly)

# Rebuilds the OpenStreetMap business packs from the Geofabrik regional extracts and publishes a COMPLETE signed
# release: spam packs and rules are carried over from the latest release. Keeps only the two newest data releases.
on:
  schedule:
    - cron: "23 4 1 * *" # day 1 of every month, 04:23 UTC
  workflow_dispatch:
    inputs:
      regions:
        description: "Region ids to rebuild, space separated (see sources/businesses/osm.yaml)"
        required: false
        default: "ES DE AT"
      dry_run:
        description: "Build, sign and verify but do not publish a release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# Shared with build-spam.yml: both publish a full manifest, so they must never run at the same time.
concurrency:
  group: data-release
  cancel-in-progress: false

env:
  KEEP_RELEASES: "2"
  REGIONS: ${{ github.event.inputs.regions || 'ES DE AT' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /opt/ghc /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install osmium-tool (extract prefilter) and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          osmium --version | head -1
          python -m pip install -r pipeline/requirements.txt

      - name: Licence audit
        run: python -m pipeline audit

      - name: Fetch the latest release (signature verified) to carry over unchanged packs
        run: |
          set -euo pipefail
          args=()
          for r in $REGIONS; do args+=(--skip-id "businesses-$(echo "$r" | tr '[:upper:]' '[:lower:]')"); done
          python -m pipeline fetch-previous "${args[@]}"

      - name: Build business packs
        run: |
          set -euo pipefail
          args=()
          for r in $REGIONS; do args+=(--region "$r"); done
          python -m pipeline businesses "${args[@]}" --prefilter
          df -h /

      - name: Choose the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/next-tag.sh

      - name: Assemble, sign and write SHA256SUMS
        env:
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
        run: |
          set -euo pipefail
          args=()
          for r in $REGIONS; do args+=(--replace-id "businesses-$(echo "$r" | tr '[:upper:]' '[:lower:]')"); done
          python -m pipeline assemble --tag "${{ steps.tag.outputs.tag }}" "${args[@]}"
          ls -l dist/release

      - name: Verify the release (signature, checksums, every pack opens and answers a query)
        run: python -m pipeline verify

      - name: Publish release and prune old ones
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: scripts/publish.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "### Businesses build"
            echo "Regions: $REGIONS"
            echo "Result: ${{ job.status }}"
            [ -f dist/release/manifest.json ] && { echo '```'; cat dist/release/manifest.json; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"
