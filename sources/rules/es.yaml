# Prefix rules for Spain. These are INFORMATIONAL rules, not spam lists (DEVIATIONS.md D-001).
country: ES
rules:
  - id: es-400-commercial
    prefix: "400"
    level: RULE
    kind: commercial
    source: BOE-A-2026-8409
    source_url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-8409
    note: >
      Commercial calls must use nine-digit numbers starting with 400 (outbound only), operational around
      17 October 2026 (Resolucion de 14 de abril de 2026, BOE num. 93, 16 April 2026). A 400 caller is a
      legitimate commercial call that identifies itself, not spam; clients should show "commercial call"
      and default to WARN. A commercial call from a non-400 number is the violation and cannot be
      detected reliably.
